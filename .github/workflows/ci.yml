name: Validate Smart Mess
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smart_mess_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_MODE: demo
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://postgres:ci-only-disposable-password@localhost:5432/smart_mess_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate && npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:ci-only-disposable-password@localhost:5432/smart_mess_test
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/ml/requirements.txt
      - run: npm run test:ml
        env:
          ML_TEST_PYTHON: python
  forecasting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/requirements*.txt
      - run: pip install -r services/ml/requirements-dev.txt
      - run: python -m pytest services/ml -q
